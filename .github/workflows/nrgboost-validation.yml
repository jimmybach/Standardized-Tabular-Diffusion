name: NRGBoost Validation

on:
  push:
    paths:
      - ".github/workflows/nrgboost-validation.yml"
      - "requirements-nrgboost-validation.txt"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/models/next_wave_baselines.py"
      - "standardized_tabular_diffusion/registry.py"
      - "standardized_tabular_diffusion/model_inventory.py"
      - "standardized_tabular_diffusion/validation/nrgboost.py"
      - "standardized_tabular_diffusion/resources/upstream/source-lock.json"
      - "docs/NRGBOOST_VALIDATION*.md"
      - "docs/evidence/nrgboost/**"
      - "docs/UPSTREAM_SOURCE_AUDIT.md"
      - "THIRD_PARTY_NOTICES.md"
      - "tests/test_nrgboost_validation.py"
      - "tests/test_upstream_provenance.py"
      - "tests/test_adapters.py"
  pull_request:
    paths:
      - ".github/workflows/nrgboost-validation.yml"
      - "requirements-nrgboost-validation.txt"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/models/next_wave_baselines.py"
      - "standardized_tabular_diffusion/registry.py"
      - "standardized_tabular_diffusion/model_inventory.py"
      - "standardized_tabular_diffusion/validation/nrgboost.py"
      - "standardized_tabular_diffusion/resources/upstream/source-lock.json"
      - "docs/NRGBOOST_VALIDATION*.md"
      - "docs/evidence/nrgboost/**"
      - "docs/UPSTREAM_SOURCE_AUDIT.md"
      - "THIRD_PARTY_NOTICES.md"
      - "tests/test_nrgboost_validation.py"
      - "tests/test_upstream_provenance.py"
      - "tests/test_adapters.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nrgboost-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-parity:
    name: Linux / Python 3.11 / native parity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-nrgboost-validation.txt

      - name: Install frozen official NRGBoost environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install -r requirements-nrgboost-validation.txt
          mkdir -p "$RUNNER_TEMP/nrgboost-wheel"
          python -m pip download \
            --index-url https://pypi.org/simple \
            --only-binary=:all: \
            --no-deps \
            --dest "$RUNNER_TEMP/nrgboost-wheel" \
            "nrgboost==0.0.3"
          echo "dfe30829ceaf2d0d0ec03eab1744838bed857d56919238e7243c9fb7f273e1fb  $RUNNER_TEMP/nrgboost-wheel/nrgboost-0.0.3-cp311-cp311-manylinux_2_28_x86_64.whl" | sha256sum --check
          python -m pip install --no-deps "$RUNNER_TEMP/nrgboost-wheel/nrgboost-0.0.3-cp311-cp311-manylinux_2_28_x86_64.whl"
          python -m pip install --no-deps .
          python -m pip check

      - name: Run real official-package-versus-adapter parity protocol
        run: |
          python -m standardized_tabular_diffusion.validation.nrgboost \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/nrgboost-validation" \
            --evidence-path "$RUNNER_TEMP/nrgboost-evidence.json" \
            --wheel-path "$RUNNER_TEMP/nrgboost-wheel/nrgboost-0.0.3-cp311-cp311-manylinux_2_28_x86_64.whl"

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nrgboost-native-parity-evidence
          path: ${{ runner.temp }}/nrgboost-evidence.json
          if-no-files-found: error
          retention-days: 90
