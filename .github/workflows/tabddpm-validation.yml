name: TabDDPM Validation

on:
  push:
    paths:
      - ".github/workflows/tabddpm-validation.yml"
      - "requirements-tabddpm-validation.txt"
      - "standardized_tabular_diffusion/models/tabddpm.py"
      - "standardized_tabular_diffusion/validation/**"
      - "standardized_tabular_diffusion/resources/upstream/tabddpm-source-manifest.json"
      - "TabDDPM-main/lib/**"
      - "TabDDPM-main/scripts/**"
      - "TabDDPM-main/tab_ddpm/**"
      - "TabDDPM-main/zero/**"
  pull_request:
    paths:
      - ".github/workflows/tabddpm-validation.yml"
      - "requirements-tabddpm-validation.txt"
      - "standardized_tabular_diffusion/models/tabddpm.py"
      - "standardized_tabular_diffusion/validation/**"
      - "standardized_tabular_diffusion/resources/upstream/tabddpm-source-manifest.json"
      - "TabDDPM-main/lib/**"
      - "TabDDPM-main/scripts/**"
      - "TabDDPM-main/tab_ddpm/**"
      - "TabDDPM-main/zero/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabddpm-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-parity:
    name: Linux / Python 3.11 / native parity
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-tabddpm-validation.txt

      - name: Install supported TabDDPM validation environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "torch==2.3.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps "rtdl==0.0.9"
          python -m pip install -r requirements-tabddpm-validation.txt
          python -m pip install --no-deps .

      - name: Run real native-versus-adapter parity protocol
        run: |
          python -m standardized_tabular_diffusion.validation.tabddpm \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/tabddpm-validation" \
            --evidence-path "$RUNNER_TEMP/tabddpm-evidence.json"

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tabddpm-native-parity-evidence
          path: ${{ runner.temp }}/tabddpm-evidence.json
          if-no-files-found: error
          retention-days: 90
