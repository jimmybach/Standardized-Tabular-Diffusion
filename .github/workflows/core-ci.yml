name: Core CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows / Python 3.11 / primary core
          - os: ubuntu-latest
            label: Linux / Python 3.11 / secondary core

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify dependency-free package surface
        run: |
          python -m pip install --no-deps .
          python -m standardized_tabular_diffusion.validation.core_ci dependency-free-surface

      - name: Install repository test dependencies
        run: |
          python -m pip install ".[dev]"
          python -m pip check

      - name: Run repository-owned tests
        run: python -m pytest -m "not adapter"

      - name: Run dependency-isolated adapter contract tests
        run: python -m pytest -m adapter

      - name: Lint
        run: python -m ruff check standardized_tabular_diffusion tests

      - name: Type-check the P0 and P1 core surface
        run: python -m mypy

      - name: Build distributions
        run: python -m build

      - name: Inspect wheel contents
        run: python -m standardized_tabular_diffusion.validation.core_ci inspect-wheel --dist-directory dist
