name: P7 Leaderboard Validation

on:
  push:
    paths:
      - ".github/workflows/p7-leaderboard-validation.yml"
      - "docs/evaluation/**"
      - "docs/evidence/evaluation/p7-*.json"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/cli.py"
      - "standardized_tabular_diffusion/evaluation/**"
      - "standardized_tabular_diffusion/schemas/evaluation/**"
      - "standardized_tabular_diffusion/validation/core_ci.py"
      - "standardized_tabular_diffusion/validation/p7_leaderboard.py"
      - "tests/evaluation/**"
      - "tests/test_cli.py"
      - "tests/test_core_ci.py"
  pull_request:
    paths:
      - ".github/workflows/p7-leaderboard-validation.yml"
      - "docs/evaluation/**"
      - "docs/evidence/evaluation/p7-*.json"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/cli.py"
      - "standardized_tabular_diffusion/evaluation/**"
      - "standardized_tabular_diffusion/schemas/evaluation/**"
      - "standardized_tabular_diffusion/validation/core_ci.py"
      - "standardized_tabular_diffusion/validation/p7_leaderboard.py"
      - "tests/evaluation/**"
      - "tests/test_cli.py"
      - "tests/test_core_ci.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p7-leaderboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p7-leaderboard:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Hosted Windows / Python 3.11 / primary-family P7 publication
            require_primary: true
          - os: ubuntu-latest
            label: Linux / Python 3.11 / secondary P7 compatibility
            require_primary: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install exact P7 validation environment
        run: |
          python -m pip install ".[leaderboard,validity,dev]"
          python -m pip check

      - name: Run P7 contract, formula, negative, and bundle integration tests
        run: >-
          python -m pytest
          tests/evaluation/test_p7_leaderboard.py
          tests/evaluation/test_p7_run_bundle_integration.py
          tests/evaluation/test_contracts_and_schemas.py
          tests/evaluation/test_cli_contracts.py
          tests/test_cli.py
          tests/test_core_ci.py

      - name: Lint and type-check P7 surfaces
        run: |
          python -m ruff check standardized_tabular_diffusion tests/evaluation tests/test_cli.py tests/test_core_ci.py
          python -m mypy

      - name: Generate P7 exit-gate evidence
        shell: bash
        run: |
          arguments=()
          if [[ "${{ matrix.require_primary }}" == "true" ]]; then
            arguments+=(--require-primary-family-environment)
          fi
          python -m standardized_tabular_diffusion.validation.p7_leaderboard \
            --output "${{ runner.temp }}/p7-leaderboard-evidence.json" \
            "${arguments[@]}"

      - name: Build and inspect the distribution artifact
        run: |
          python -m build
          python -m standardized_tabular_diffusion.validation.core_ci inspect-wheel --dist-directory dist
          python -m standardized_tabular_diffusion.validation.core_ci install-wheel --dist-directory dist
          std-tabular-diffusion --help

      - name: Preserve pre-protocol failure evidence
        if: ${{ failure() }}
        run: >-
          python -m standardized_tabular_diffusion.validation.workflow_evidence
          --output "${{ runner.temp }}/p7-leaderboard-evidence.json"
          --protocol-id p7-leaderboard-exit-gate-v1
          --phase P7
          --message "The P7 workflow failed before protocol evidence was produced."

      - name: Upload P7 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p7-leaderboard-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/p7-leaderboard-evidence.json
          if-no-files-found: error
          retention-days: 30
