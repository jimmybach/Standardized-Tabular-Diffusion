name: Goggle Validation

on:
  push:
    paths:
      - ".github/workflows/goggle-validation.yml"
      - "requirements-goggle-validation.txt"
      - "standardized_tabular_diffusion/compat/goggle_launcher.py"
      - "standardized_tabular_diffusion/models/goggle.py"
      - "standardized_tabular_diffusion/registry.py"
      - "standardized_tabular_diffusion/runner.py"
      - "standardized_tabular_diffusion/upstream_sources.py"
      - "standardized_tabular_diffusion/validation/goggle.py"
      - "standardized_tabular_diffusion/resources/upstream/goggle-source-manifest.json"
      - "standardized_tabular_diffusion/resources/upstream/source-lock.json"
      - "tests/test_goggle_adapter.py"
      - "tests/test_upstream_sources.py"
      - "docs/GOGGLE_VALIDATION*.md"
      - "docs/evidence/goggle/**"
  pull_request:
    paths:
      - ".github/workflows/goggle-validation.yml"
      - "requirements-goggle-validation.txt"
      - "standardized_tabular_diffusion/compat/goggle_launcher.py"
      - "standardized_tabular_diffusion/models/goggle.py"
      - "standardized_tabular_diffusion/registry.py"
      - "standardized_tabular_diffusion/runner.py"
      - "standardized_tabular_diffusion/upstream_sources.py"
      - "standardized_tabular_diffusion/validation/goggle.py"
      - "standardized_tabular_diffusion/resources/upstream/goggle-source-manifest.json"
      - "standardized_tabular_diffusion/resources/upstream/source-lock.json"
      - "tests/test_goggle_adapter.py"
      - "tests/test_upstream_sources.py"
      - "docs/GOGGLE_VALIDATION*.md"
      - "docs/evidence/goggle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goggle-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-parity:
    name: Linux / Python 3.11 / method-author native parity
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-goggle-validation.txt

      - name: Install frozen Goggle validation environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "torch==2.3.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-goggle-validation.txt
          python -m pip install --no-deps .

      - name: Materialize checksum-locked method-author source
        run: |
          python -m standardized_tabular_diffusion.cli materialize-model-source \
            --model goggle \
            --repo-root "$GITHUB_WORKSPACE"

      - name: Run focused contract tests
        run: |
          python -m pytest tests/test_goggle_adapter.py tests/test_upstream_sources.py -q

      - name: Run real official-source-versus-adapter parity protocol
        run: |
          python -m standardized_tabular_diffusion.validation.goggle \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/goggle-validation" \
            --evidence-path "$RUNNER_TEMP/goggle-evidence.json"

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: goggle-method-author-native-parity-evidence
          path: ${{ runner.temp }}/goggle-evidence.json
          if-no-files-found: warn
          retention-days: 90
