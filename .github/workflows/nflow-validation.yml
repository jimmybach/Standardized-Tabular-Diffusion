name: NFlow Validation

on:
  push:
    paths:
      - ".github/workflows/nflow-validation.yml"
      - "requirements-nflow-validation.txt"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/models/structured_baselines.py"
      - "standardized_tabular_diffusion/registry.py"
      - "standardized_tabular_diffusion/model_inventory.py"
      - "standardized_tabular_diffusion/runner.py"
      - "standardized_tabular_diffusion/validation/nflow.py"
      - "standardized_tabular_diffusion/resources/upstream/source-lock.json"
      - "docs/NFLOW_VALIDATION*.md"
      - "docs/evidence/nflow/**"
      - "docs/UPSTREAM_SOURCE_AUDIT.md"
      - "docs/model_reproducibility_assessment.md"
      - "docs/runtime_status.md"
      - "THIRD_PARTY_NOTICES.md"
      - "tests/test_nflow_validation.py"
      - "tests/test_upstream_provenance.py"
      - "tests/test_adapters.py"
  pull_request:
    paths:
      - ".github/workflows/nflow-validation.yml"
      - "requirements-nflow-validation.txt"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/models/structured_baselines.py"
      - "standardized_tabular_diffusion/registry.py"
      - "standardized_tabular_diffusion/model_inventory.py"
      - "standardized_tabular_diffusion/runner.py"
      - "standardized_tabular_diffusion/validation/nflow.py"
      - "standardized_tabular_diffusion/resources/upstream/source-lock.json"
      - "docs/NFLOW_VALIDATION*.md"
      - "docs/evidence/nflow/**"
      - "docs/UPSTREAM_SOURCE_AUDIT.md"
      - "docs/model_reproducibility_assessment.md"
      - "docs/runtime_status.md"
      - "THIRD_PARTY_NOTICES.md"
      - "tests/test_nflow_validation.py"
      - "tests/test_upstream_provenance.py"
      - "tests/test_adapters.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nflow-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-parity:
    name: Linux / Python 3.11 / official-package recipe parity
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-nflow-validation.txt

      - name: Install frozen official nflows environment
        run: |
          python -m pip install --upgrade "pip==25.1.1" "setuptools==80.10.2"
          python -m pip install "torch==2.3.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-nflow-validation.txt
          mkdir -p "$RUNNER_TEMP/nflows-sdist"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/nflows-sdist/nflows-0.14.tar.gz" \
            "https://files.pythonhosted.org/packages/bd/16/a484db41aab28332f42080435c9342fa87cfc9a4fce5495521ea1e80ca27/nflows-0.14.tar.gz"
          echo "6299844a62f9999fcdf2d95cb2d01c091a50136bd17826e303aba646b2d11b55  $RUNNER_TEMP/nflows-sdist/nflows-0.14.tar.gz" | sha256sum --check
          python -m pip install \
            --no-deps \
            --no-build-isolation \
            --use-pep517 \
            "$RUNNER_TEMP/nflows-sdist/nflows-0.14.tar.gz"
          python -m pip install --no-deps .
          python -m pip check

      - name: Run direct-package-versus-adapter recipe-parity protocol
        run: |
          set +e
          python -m standardized_tabular_diffusion.validation.nflow \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/nflow-validation" \
            --evidence-path "$RUNNER_TEMP/nflow-evidence.json" \
            --sdist-path "$RUNNER_TEMP/nflows-sdist/nflows-0.14.tar.gz"
          validation_status=$?
          set -e
          if [ "$validation_status" -ne 0 ] && [ ! -f "$RUNNER_TEMP/nflow-evidence.json" ]; then
            NFLOW_VALIDATION_STATUS="$validation_status" python -c 'import json, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("nflow-evidence.json").write_text(json.dumps({"schema_version": 1, "protocol_id": "nflows-maf-tabular-recipe-parity-v1", "model_id": "nflow", "status": "fail", "repository_commit": os.environ["GITHUB_SHA"], "error_type": "PreProtocolFailure", "error": "The validation process exited before its internal diagnostic handler completed.", "process_exit_status": int(os.environ["NFLOW_VALIDATION_STATUS"])}, indent=2, sort_keys=True) + "\n", encoding="utf-8")'
          fi
          exit "$validation_status"

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: nflow-native-parity-evidence
          path: ${{ runner.temp }}/nflow-evidence.json
          if-no-files-found: error
          retention-days: 90
