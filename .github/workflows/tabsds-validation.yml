name: TabSDS Validation

on:
  push:
    paths:
      - ".github/workflows/tabsds-validation.yml"
      - "requirements-tabsds-validation.txt"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/models/paper_gap_baselines.py"
      - "standardized_tabular_diffusion/registry.py"
      - "standardized_tabular_diffusion/model_inventory.py"
      - "standardized_tabular_diffusion/runner.py"
      - "standardized_tabular_diffusion/upstream_sources.py"
      - "standardized_tabular_diffusion/validation/tabsds.py"
      - "standardized_tabular_diffusion/resources/upstream/tabsds-source-manifest.json"
      - "standardized_tabular_diffusion/resources/upstream/source-lock.json"
      - "docs/TABSDS_VALIDATION*.md"
      - "docs/evidence/tabsds/**"
      - "docs/UPSTREAM_SOURCE_AUDIT.md"
      - "THIRD_PARTY_NOTICES.md"
      - "tests/test_tabsds_validation.py"
      - "tests/test_upstream_sources.py"
      - "tests/test_upstream_provenance.py"
  pull_request:
    paths:
      - ".github/workflows/tabsds-validation.yml"
      - "requirements-tabsds-validation.txt"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/models/paper_gap_baselines.py"
      - "standardized_tabular_diffusion/registry.py"
      - "standardized_tabular_diffusion/model_inventory.py"
      - "standardized_tabular_diffusion/runner.py"
      - "standardized_tabular_diffusion/upstream_sources.py"
      - "standardized_tabular_diffusion/validation/tabsds.py"
      - "standardized_tabular_diffusion/resources/upstream/tabsds-source-manifest.json"
      - "standardized_tabular_diffusion/resources/upstream/source-lock.json"
      - "docs/TABSDS_VALIDATION*.md"
      - "docs/evidence/tabsds/**"
      - "docs/UPSTREAM_SOURCE_AUDIT.md"
      - "THIRD_PARTY_NOTICES.md"
      - "tests/test_tabsds_validation.py"
      - "tests/test_upstream_sources.py"
      - "tests/test_upstream_provenance.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabsds-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-parity:
    name: Linux / Python 3.11 / method-author source parity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-tabsds-validation.txt

      - name: Install frozen TabSDS validation environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install -r requirements-tabsds-validation.txt
          python -m pip install --no-deps .
          python -m pip check
          python -m standardized_tabular_diffusion.cli materialize-model-source \
            --model tabsds \
            --repo-root "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/tabsds-source"

      - name: Run source and adapter contract tests
        run: |
          python -m pytest tests/test_tabsds_validation.py tests/test_upstream_sources.py tests/test_upstream_provenance.py -q

      - name: Run direct-source-versus-adapter parity protocol
        run: |
          set +e
          python -m standardized_tabular_diffusion.validation.tabsds \
            --repo-root "$GITHUB_WORKSPACE" \
            --source-root "$RUNNER_TEMP/tabsds-source" \
            --output-dir "$RUNNER_TEMP/tabsds-validation" \
            --evidence-path "$RUNNER_TEMP/tabsds-evidence.json"
          validation_status=$?
          set -e
          if [ "$validation_status" -ne 0 ] && [ ! -f "$RUNNER_TEMP/tabsds-evidence.json" ]; then
            TABSDS_VALIDATION_STATUS="$validation_status" python -c 'import json, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("tabsds-evidence.json").write_text(json.dumps({"schema_version": 1, "protocol_id": "tabsds-official-source-parity-v1", "model_id": "tabsds", "status": "fail", "repository_commit": os.environ["GITHUB_SHA"], "error_type": "PreProtocolFailure", "error": "The validation process exited before its internal diagnostic handler completed.", "process_exit_status": int(os.environ["TABSDS_VALIDATION_STATUS"])}, indent=2, sort_keys=True) + "\n", encoding="utf-8")'
          fi
          exit "$validation_status"

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tabsds-native-parity-evidence
          path: ${{ runner.temp }}/tabsds-evidence.json
          if-no-files-found: error
          retention-days: 90
