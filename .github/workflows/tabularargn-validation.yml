name: TabularARGN Validation

on:
  push:
    paths:
      - ".github/workflows/tabularargn-validation.yml"
      - "requirements-tabularargn-validation.txt"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/models/tabularargn.py"
      - "standardized_tabular_diffusion/models/__init__.py"
      - "standardized_tabular_diffusion/registry.py"
      - "standardized_tabular_diffusion/model_inventory.py"
      - "standardized_tabular_diffusion/runner.py"
      - "standardized_tabular_diffusion/validation/tabularargn.py"
      - "standardized_tabular_diffusion/resources/upstream/tabularargn-wheel-manifest.json"
      - "standardized_tabular_diffusion/resources/upstream/source-lock.json"
      - "docs/TABULARARGN_VALIDATION*.md"
      - "docs/evidence/tabularargn/**"
      - "docs/UPSTREAM_SOURCE_AUDIT.md"
      - "THIRD_PARTY_NOTICES.md"
      - "tests/test_tabularargn_adapter.py"
      - "tests/test_tabularargn_validation.py"
      - "tests/test_upstream_provenance.py"
      - "tests/test_adapters.py"
  pull_request:
    paths:
      - ".github/workflows/tabularargn-validation.yml"
      - "requirements-tabularargn-validation.txt"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/models/tabularargn.py"
      - "standardized_tabular_diffusion/models/__init__.py"
      - "standardized_tabular_diffusion/registry.py"
      - "standardized_tabular_diffusion/model_inventory.py"
      - "standardized_tabular_diffusion/runner.py"
      - "standardized_tabular_diffusion/validation/tabularargn.py"
      - "standardized_tabular_diffusion/resources/upstream/tabularargn-wheel-manifest.json"
      - "standardized_tabular_diffusion/resources/upstream/source-lock.json"
      - "docs/TABULARARGN_VALIDATION*.md"
      - "docs/evidence/tabularargn/**"
      - "docs/UPSTREAM_SOURCE_AUDIT.md"
      - "THIRD_PARTY_NOTICES.md"
      - "tests/test_tabularargn_adapter.py"
      - "tests/test_tabularargn_validation.py"
      - "tests/test_upstream_provenance.py"
      - "tests/test_adapters.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabularargn-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-parity:
    name: Linux / Python 3.11 / official package parity
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-tabularargn-validation.txt

      - name: Install frozen official TabularARGN environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.11.0" "torchaudio==2.11.0" "torchvision==0.26.0"
          python -m pip install -r requirements-tabularargn-validation.txt
          mkdir -p "$RUNNER_TEMP/tabularargn-release"
          python -m pip download \
            --index-url https://pypi.org/simple \
            --only-binary=:all: \
            --no-deps \
            --dest "$RUNNER_TEMP/tabularargn-release" \
            "mostlyai-engine==2.6.2"
          echo "3ead3770c936919f8fce4e1f9fffd271ffdd490f0292c2ab9a42cb4bafe3caea  $RUNNER_TEMP/tabularargn-release/mostlyai_engine-2.6.2-py3-none-any.whl" | sha256sum --check
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/tabularargn-release/mostlyai-engine-0b96f02.zip" \
            "https://codeload.github.com/mostly-ai/mostlyai-engine/zip/0b96f02e4fad47c7c19c985fda4311230e20bbb5"
          echo "d80cd89b14cdf793e07a2e5b53abe36b5824376d6aa73ae63c56052cf9043c66  $RUNNER_TEMP/tabularargn-release/mostlyai-engine-0b96f02.zip" | sha256sum --check
          python -m pip install --no-deps "$RUNNER_TEMP/tabularargn-release/mostlyai_engine-2.6.2-py3-none-any.whl"
          python -m pip install --no-deps .
          python -m pip check

      - name: Run locked-package and adapter contract tests
        env:
          TABULARARGN_WHEEL_PATH: ${{ runner.temp }}/tabularargn-release/mostlyai_engine-2.6.2-py3-none-any.whl
          TABULARARGN_SOURCE_ARCHIVE_PATH: ${{ runner.temp }}/tabularargn-release/mostlyai-engine-0b96f02.zip
        run: |
          python -m pytest \
            tests/test_tabularargn_adapter.py \
            tests/test_tabularargn_validation.py \
            tests/test_upstream_provenance.py \
            -q

      - name: Run real official-package-versus-adapter parity protocol
        run: |
          set +e
          python -m standardized_tabular_diffusion.validation.tabularargn \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/tabularargn-validation" \
            --evidence-path "$RUNNER_TEMP/tabularargn-evidence.json" \
            --wheel-path "$RUNNER_TEMP/tabularargn-release/mostlyai_engine-2.6.2-py3-none-any.whl" \
            --source-archive-path "$RUNNER_TEMP/tabularargn-release/mostlyai-engine-0b96f02.zip"
          validation_status=$?
          set -e
          if [ "$validation_status" -ne 0 ] && [ ! -f "$RUNNER_TEMP/tabularargn-evidence.json" ]; then
            TABULARARGN_VALIDATION_STATUS="$validation_status" python -c 'import json, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("tabularargn-evidence.json").write_text(json.dumps({"schema_version": 1, "protocol_id": "tabularargn-official-package-parity-v1", "model_id": "tabularargn", "status": "fail", "repository_commit": os.environ["GITHUB_SHA"], "error_type": "PreProtocolFailure", "error": "The validation process exited before its internal diagnostic handler completed.", "process_exit_status": int(os.environ["TABULARARGN_VALIDATION_STATUS"])}, indent=2, sort_keys=True) + "\n", encoding="utf-8")'
          fi
          exit "$validation_status"

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tabularargn-native-parity-evidence
          path: ${{ runner.temp }}/tabularargn-evidence.json
          if-no-files-found: error
          retention-days: 90
