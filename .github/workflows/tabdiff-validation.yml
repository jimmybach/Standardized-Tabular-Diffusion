name: TabDiff Validation

on:
  push:
    paths:
      - ".github/workflows/tabdiff-validation.yml"
      - "requirements-tabdiff-validation.txt"
      - "standardized_tabular_diffusion/models/tabdiff.py"
      - "standardized_tabular_diffusion/registry.py"
      - "standardized_tabular_diffusion/validation/tabdiff.py"
      - "standardized_tabular_diffusion/resources/upstream/source-lock.json"
      - "standardized_tabular_diffusion/resources/upstream/tabdiff-source-manifest.json"
      - "docs/TABDIFF_VALIDATION*.md"
      - "docs/evidence/tabdiff/**"
      - "TabDiff-main/**"
  pull_request:
    paths:
      - ".github/workflows/tabdiff-validation.yml"
      - "requirements-tabdiff-validation.txt"
      - "standardized_tabular_diffusion/models/tabdiff.py"
      - "standardized_tabular_diffusion/registry.py"
      - "standardized_tabular_diffusion/validation/tabdiff.py"
      - "standardized_tabular_diffusion/resources/upstream/source-lock.json"
      - "standardized_tabular_diffusion/resources/upstream/tabdiff-source-manifest.json"
      - "docs/TABDIFF_VALIDATION*.md"
      - "docs/evidence/tabdiff/**"
      - "TabDiff-main/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tabdiff-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-parity:
    name: Linux / Python 3.11 / native parity
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-tabdiff-validation.txt

      - name: Install supported TabDiff validation environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "torch==2.3.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-tabdiff-validation.txt
          python -m pip install --no-deps .

      - name: Run real native-versus-adapter parity protocol
        run: |
          python -m standardized_tabular_diffusion.validation.tabdiff \
            --repo-root "$GITHUB_WORKSPACE" \
            --output-dir "$RUNNER_TEMP/tabdiff-validation" \
            --evidence-path "$RUNNER_TEMP/tabdiff-evidence.json"

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tabdiff-native-parity-evidence
          path: ${{ runner.temp }}/tabdiff-evidence.json
          if-no-files-found: error
          retention-days: 90
