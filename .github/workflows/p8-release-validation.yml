name: P8 Migration and Release Validation

on:
  push:
    paths:
      - ".github/workflows/p8-release-validation.yml"
      - "CHANGELOG.md"
      - "CITATION.cff"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "CONTRIBUTORS.md"
      - "LICENSE"
      - "NOTICE"
      - "README.md"
      - "RELEASE_CHECKLIST.md"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICES.md"
      - "MANIFEST.in"
      - "requirements-*.txt"
      - "docs/**"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/p8-release-validation.yml"
      - "CHANGELOG.md"
      - "CITATION.cff"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - "CONTRIBUTORS.md"
      - "LICENSE"
      - "NOTICE"
      - "README.md"
      - "RELEASE_CHECKLIST.md"
      - "SECURITY.md"
      - "THIRD_PARTY_NOTICES.md"
      - "MANIFEST.in"
      - "requirements-*.txt"
      - "docs/**"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p8-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p8-release:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Hosted Windows / Python 3.11 / primary-family release gate
            primary_argument: --require-primary-family-environment
          - os: ubuntu-latest
            label: Linux / Python 3.11 / portable release gate
            primary_argument: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install exact P8 release environment
        run: |
          python -m pip install ".[quickstart,dev]"
          python -m pip check

      - name: Run P8 migration, release, and central-route tests
        run: >-
          python -m pytest
          tests/evaluation/test_p8_legacy_migration.py
          tests/evaluation/test_p8_quickstart.py
          tests/evaluation/test_contracts_and_schemas.py
          tests/evaluation/test_cli_contracts.py
          tests/orchestration/test_pipeline.py
          tests/test_cli.py
          tests/test_core_ci.py
          tests/test_release_legal_metadata.py
          tests/test_p8_release_assets.py

      - name: Lint and type-check release surfaces
        run: |
          python -m ruff check standardized_tabular_diffusion tests
          python -m mypy

      - name: Generate P8 exit-gate evidence
        run: >-
          python -m standardized_tabular_diffusion.validation.p8_release
          --output "${{ runner.temp }}/p8-release-evidence.json"
          ${{ matrix.primary_argument }}

      - name: Build and inspect distributions
        run: |
          python -m build
          python -m standardized_tabular_diffusion.validation.core_ci inspect-wheel --dist-directory dist
          python -m standardized_tabular_diffusion.validation.core_ci inspect-sdist --dist-directory dist
          python -m standardized_tabular_diffusion.validation.core_ci clean-install --artifact wheel --dist-directory dist
          python -m standardized_tabular_diffusion.validation.core_ci clean-install --artifact sdist --dist-directory dist

      - name: Preserve pre-protocol failure evidence
        if: ${{ failure() }}
        run: >-
          python -m standardized_tabular_diffusion.validation.workflow_evidence
          --output "${{ runner.temp }}/p8-release-evidence.json"
          --protocol-id p8-migration-release-exit-gate-v1
          --phase P8
          --message "The P8 workflow failed before protocol evidence was produced."

      - name: Upload P8 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p8-release-${{ matrix.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/p8-release-evidence.json
          if-no-files-found: error
          retention-days: 30
