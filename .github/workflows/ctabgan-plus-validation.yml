name: CTAB-GAN+ Validation

on:
  push:
    paths:
      - ".github/workflows/ctabgan-plus-validation.yml"
      - "requirements-ctabgan-plus-validation.txt"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/models/_runtime.py"
      - "standardized_tabular_diffusion/models/next_wave_baselines.py"
      - "standardized_tabular_diffusion/upstream_sources.py"
      - "standardized_tabular_diffusion/validation/ctabgan_plus.py"
      - "standardized_tabular_diffusion/resources/upstream/ctabgan-plus-source-manifest.json"
      - "standardized_tabular_diffusion/resources/upstream/source-lock.json"
      - "docs/CTABGAN_PLUS_VALIDATION*.md"
      - "docs/evidence/ctabgan-plus/**"
      - "docs/UPSTREAM_SOURCE_AUDIT.md"
      - "THIRD_PARTY_NOTICES.md"
      - "tests/test_ctabgan_plus_validation.py"
      - "tests/test_upstream_sources.py"
      - "tests/test_upstream_provenance.py"
      - "tests/test_adapters.py"
  pull_request:
    paths:
      - ".github/workflows/ctabgan-plus-validation.yml"
      - "requirements-ctabgan-plus-validation.txt"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/models/_runtime.py"
      - "standardized_tabular_diffusion/models/next_wave_baselines.py"
      - "standardized_tabular_diffusion/upstream_sources.py"
      - "standardized_tabular_diffusion/validation/ctabgan_plus.py"
      - "standardized_tabular_diffusion/resources/upstream/ctabgan-plus-source-manifest.json"
      - "standardized_tabular_diffusion/resources/upstream/source-lock.json"
      - "docs/CTABGAN_PLUS_VALIDATION*.md"
      - "docs/evidence/ctabgan-plus/**"
      - "docs/UPSTREAM_SOURCE_AUDIT.md"
      - "THIRD_PARTY_NOTICES.md"
      - "tests/test_ctabgan_plus_validation.py"
      - "tests/test_upstream_sources.py"
      - "tests/test_upstream_provenance.py"
      - "tests/test_adapters.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ctabgan-plus-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-parity:
    name: Linux / Python 3.11 / native parity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ctabgan-plus-validation.txt

      - name: Install frozen CTAB-GAN+ validation environment
        run: |
          python -m pip install --upgrade "pip==25.1.1"
          python -m pip install "torch==2.3.0" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-ctabgan-plus-validation.txt
          python -m pip install --no-deps .
          python -m pip check

      - name: Acquire checksum-locked official source
        run: |
          python -m standardized_tabular_diffusion.cli materialize-model-source \
            --model ctab-gan-plus \
            --repo-root "$GITHUB_WORKSPACE" \
            --destination "$RUNNER_TEMP/ctabgan-plus-source"

      - name: Run real official-source-versus-adapter parity protocol
        run: |
          set +e
          python -m standardized_tabular_diffusion.validation.ctabgan_plus \
            --repo-root "$GITHUB_WORKSPACE" \
            --source-dir "$RUNNER_TEMP/ctabgan-plus-source" \
            --output-dir "$RUNNER_TEMP/ctabgan-plus-validation" \
            --evidence-path "$RUNNER_TEMP/ctabgan-plus-evidence.json"
          validation_status=$?
          set -e
          if [ "$validation_status" -ne 0 ] && [ ! -f "$RUNNER_TEMP/ctabgan-plus-evidence.json" ]; then
            CTABGAN_PLUS_VALIDATION_STATUS="$validation_status" python -c 'import json, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("ctabgan-plus-evidence.json").write_text(json.dumps({"schema_version": 1, "protocol_id": "ctabgan-plus-native-parity-v1", "model_id": "ctab-gan-plus", "status": "fail", "repository_commit": os.environ["GITHUB_SHA"], "error_type": "PreProtocolFailure", "error": "The validation process exited before its internal diagnostic handler completed.", "process_exit_status": int(os.environ["CTABGAN_PLUS_VALIDATION_STATUS"])}, indent=2, sort_keys=True) + "\n", encoding="utf-8")'
          fi
          exit "$validation_status"

      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ctabgan-plus-native-parity-evidence
          path: ${{ runner.temp }}/ctabgan-plus-evidence.json
          if-no-files-found: error
          retention-days: 90
