name: P1 Evaluation Foundation Validation

on:
  push:
    paths:
      - ".github/workflows/p1-foundation-validation.yml"
      - "configs/datasets/**"
      - "docs/evaluation/IMPLEMENTATION_ROADMAP.md"
      - "docs/evaluation/IMPLEMENTATION_ROADMAP.zh-CN.md"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/cli.py"
      - "standardized_tabular_diffusion/evaluation/**"
      - "standardized_tabular_diffusion/resources/evaluation/**"
      - "standardized_tabular_diffusion/schemas/evaluation/**"
      - "standardized_tabular_diffusion/validation/p1_foundation.py"
      - "tests/evaluation/**"
  pull_request:
    paths:
      - ".github/workflows/p1-foundation-validation.yml"
      - "configs/datasets/**"
      - "docs/evaluation/IMPLEMENTATION_ROADMAP.md"
      - "docs/evaluation/IMPLEMENTATION_ROADMAP.zh-CN.md"
      - "pyproject.toml"
      - "standardized_tabular_diffusion/cli.py"
      - "standardized_tabular_diffusion/evaluation/**"
      - "standardized_tabular_diffusion/resources/evaluation/**"
      - "standardized_tabular_diffusion/schemas/evaluation/**"
      - "standardized_tabular_diffusion/validation/p1_foundation.py"
      - "tests/evaluation/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  p1-foundation:
    name: Linux / Python 3.11 / P1 contracts and identity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install P1 validation environment
        run: |
          python -m pip install ".[dev]"
          python -m pip check

      - name: Run P1 contract and bundle tests
        run: python -m pytest tests/evaluation

      - name: Lint P1 surface
        run: >-
          python -m ruff check
          standardized_tabular_diffusion/evaluation
          standardized_tabular_diffusion/cli.py
          standardized_tabular_diffusion/validation/p1_foundation.py
          tests/evaluation

      - name: Type-check core and P1 surface
        run: python -m mypy

      - name: Build distributions
        run: python -m build

      - name: Generate P1 exit-gate evidence
        run: >-
          python -m standardized_tabular_diffusion.validation.p1_foundation
          --output "${RUNNER_TEMP}/p1-foundation-evidence.json"
          --require-primary-environment

      - name: Preserve pre-protocol failure evidence
        if: always()
        shell: bash
        run: |
          if [[ ! -f "${RUNNER_TEMP}/p1-foundation-evidence.json" ]]; then
            python - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "p1-foundation-evidence.json"
          output.write_text(
              json.dumps(
                  {
                      "evidence_schema_version": "1.0.0",
                      "protocol_id": "p1-contracts-identity-foundation-v1",
                      "phase": "P1",
                      "status": "fail",
                      "repository_commit": os.environ.get("GITHUB_SHA", "unknown"),
                      "error_type": "PreProtocolFailure",
                      "error": "A required P1 workflow step failed before evidence generation.",
                  },
                  indent=2,
                  sort_keys=True,
              )
              + "\n",
              encoding="utf-8",
          )
          PY
          fi

      - name: Upload P1 evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p1-foundation-evidence
          path: ${{ runner.temp }}/p1-foundation-evidence.json
          if-no-files-found: error
          retention-days: 90
