name: P4 Dataset-Scale Protocol Validation

on:
  push:
    paths:
      - ".github/workflows/p4-dataset-scale-validation.yml"
      - "configs/datasets/adult-uci-2-v1.json"
      - "configs/datasets/sick-uci-102-v1.json"
      - "standardized_tabular_diffusion/evaluation/utility.py"
      - "standardized_tabular_diffusion/resources/evaluation/evaluators/p4-dataset-scale-windows-gpu-stable-v1.json"
      - "standardized_tabular_diffusion/resources/evaluation/evaluators/p4-utility-stable-v1.json"
      - "standardized_tabular_diffusion/validation/p4_dataset_scale.py"
      - "tests/evaluation/test_p4_dataset_scale_validation.py"
      - "tests/test_p4_dataset_scale_retained_evidence.py"
      - "tests/test_p4_windows_gpu_retained_evidence.py"
      - "tests/test_p4_stable_successor_retained_evidence.py"
      - "docs/evaluation/P4_UTILITY*.md"
      - "docs/evaluation/IMPLEMENTATION_ROADMAP*.md"
      - "docs/evidence/evaluation/p4-dataset-scale-*.json"
  pull_request:
    paths:
      - ".github/workflows/p4-dataset-scale-validation.yml"
      - "configs/datasets/adult-uci-2-v1.json"
      - "configs/datasets/sick-uci-102-v1.json"
      - "standardized_tabular_diffusion/evaluation/utility.py"
      - "standardized_tabular_diffusion/resources/evaluation/evaluators/p4-dataset-scale-windows-gpu-stable-v1.json"
      - "standardized_tabular_diffusion/resources/evaluation/evaluators/p4-utility-stable-v1.json"
      - "standardized_tabular_diffusion/validation/p4_dataset_scale.py"
      - "tests/evaluation/test_p4_dataset_scale_validation.py"
      - "tests/test_p4_dataset_scale_retained_evidence.py"
      - "tests/test_p4_windows_gpu_retained_evidence.py"
      - "tests/test_p4_stable_successor_retained_evidence.py"
      - "docs/evaluation/P4_UTILITY*.md"
      - "docs/evaluation/IMPLEMENTATION_ROADMAP*.md"
      - "docs/evidence/evaluation/p4-dataset-scale-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4-dataset-scale-protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Windows-primary successor contracts
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install contract-test dependencies
        run: |
          python -m pip install ".[dev]" "psutil==6.1.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate successor schedule, finalizer, and retained history
        run: >-
          python -m pytest
          tests/evaluation/test_p4_dataset_scale_validation.py
          tests/test_p4_dataset_scale_retained_evidence.py
          tests/test_p4_windows_gpu_retained_evidence.py
          tests/test_p4_stable_successor_retained_evidence.py
          -q

      - name: Lint dataset-scale surfaces
        run: >-
          python -m ruff check
          standardized_tabular_diffusion/validation/p4_dataset_scale.py
          tests/evaluation/test_p4_dataset_scale_validation.py
          tests/test_p4_dataset_scale_retained_evidence.py
          tests/test_p4_windows_gpu_retained_evidence.py

# The full 67-task run requires the recorded native Windows 11 / RTX 5080
# runtime and is intentionally executed locally through p4_dataset_scale.
# GitHub-hosted Windows runners do not provide that GPU and must not produce
# substitute admission evidence.
