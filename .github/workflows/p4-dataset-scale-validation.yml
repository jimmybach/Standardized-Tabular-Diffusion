name: P4 Dataset-Scale Admission Validation

on:
  push:
    paths:
      - ".github/workflows/p4-dataset-scale-validation.yml"
      - "configs/datasets/adult-uci-2-v1.json"
      - "configs/datasets/sick-uci-102-v1.json"
      - "requirements-p4-global-source-validation.txt"
      - "standardized_tabular_diffusion/evaluation/tabstruct.py"
      - "standardized_tabular_diffusion/evaluation/utility.py"
      - "standardized_tabular_diffusion/resources/evaluation/evaluators/p4-dataset-scale-pilot-v1.json"
      - "standardized_tabular_diffusion/resources/evaluation/evaluators/p4-utility-pilot-v1.json"
      - "standardized_tabular_diffusion/resources/evaluation/upstream/tabeval-p4-source.json"
      - "standardized_tabular_diffusion/validation/p4_dataset_scale.py"
      - "tests/evaluation/test_p4_dataset_scale_validation.py"
      - "tests/test_p4_dataset_scale_retained_evidence.py"
      - "docs/evaluation/P4_UTILITY*.md"
      - "docs/evaluation/IMPLEMENTATION_ROADMAP*.md"
      - "docs/evidence/evaluation/p4-dataset-scale-*.json"
  pull_request:
    paths:
      - ".github/workflows/p4-dataset-scale-validation.yml"
      - "configs/datasets/adult-uci-2-v1.json"
      - "configs/datasets/sick-uci-102-v1.json"
      - "requirements-p4-global-source-validation.txt"
      - "standardized_tabular_diffusion/evaluation/tabstruct.py"
      - "standardized_tabular_diffusion/evaluation/utility.py"
      - "standardized_tabular_diffusion/resources/evaluation/evaluators/p4-dataset-scale-pilot-v1.json"
      - "standardized_tabular_diffusion/resources/evaluation/evaluators/p4-utility-pilot-v1.json"
      - "standardized_tabular_diffusion/resources/evaluation/upstream/tabeval-p4-source.json"
      - "standardized_tabular_diffusion/validation/p4_dataset_scale.py"
      - "tests/evaluation/test_p4_dataset_scale_validation.py"
      - "tests/test_p4_dataset_scale_retained_evidence.py"
      - "docs/evaluation/P4_UTILITY*.md"
      - "docs/evaluation/IMPLEMENTATION_ROADMAP*.md"
      - "docs/evidence/evaluation/p4-dataset-scale-*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p4-dataset-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Linux / Python 3.11 / preregistration and evidence contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install contract-test dependencies
        run: |
          python -m pip install ".[dev]" "psutil==6.1.1"
          python -m pip check

      - name: Validate the preregistered schedule and evidence finalizer
        run: >-
          python -m pytest
          tests/evaluation/test_p4_dataset_scale_validation.py
          -q

      - name: Lint the dataset-scale surfaces
        run: >-
          python -m ruff check
          standardized_tabular_diffusion/validation/p4_dataset_scale.py
          tests/evaluation/test_p4_dataset_scale_validation.py

  dataset-scale:
    if: github.event_name == 'workflow_dispatch'
    needs: protocol
    name: ${{ matrix.dataset }} / ${{ matrix.mode }} / shard ${{ matrix.shard_index }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - {dataset: adult, mode: coverage, shard_index: 0, shard_count: 3}
          - {dataset: adult, mode: coverage, shard_index: 1, shard_count: 3}
          - {dataset: adult, mode: coverage, shard_index: 2, shard_count: 3}
          - {dataset: sick, mode: coverage, shard_index: 0, shard_count: 4}
          - {dataset: sick, mode: coverage, shard_index: 1, shard_count: 4}
          - {dataset: sick, mode: coverage, shard_index: 2, shard_count: 4}
          - {dataset: sick, mode: coverage, shard_index: 3, shard_count: 4}
          - {dataset: adult, mode: stability, shard_index: 0, shard_count: 1}
          - {dataset: sick, mode: stability, shard_index: 0, shard_count: 1}
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      STANDARDIZED_TABULAR_DIFFUSION_ENABLE_TABPFN: "1"
      TABPFN_ALLOW_CPU_LARGE_DATASET: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-p4-global-source-validation.txt

      - name: Configure isolated runtime paths
        run: |
          echo "TABPFN_MODEL_CACHE_DIR=$RUNNER_TEMP/p4-tabpfn-models" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/p4-xdg-cache" >> "$GITHUB_ENV"
          echo "P4_SHARD_OUTPUT=$RUNNER_TEMP/p4-dataset-scale-shard.json" >> "$GITHUB_ENV"

      - name: Initialize fail-closed shard evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = {
              "evidence_schema_version": "1.0.0",
              "protocol_id": "p4-dataset-scale-admission-pilot-v1",
              "evidence_type": "dataset-scale-shard",
              "status": "fail",
              "repository_commit": os.environ["GITHUB_SHA"],
              "error_type": "PreProtocolFailure",
              "error": "A required workflow step failed before the shard protocol completed.",
          }
          Path(os.environ["P4_SHARD_OUTPUT"]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

      - name: Install the frozen CPU source runtime
        run: |
          python -m pip install --upgrade "pip==25.1.1" "setuptools==80.10.2"
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.3.0"
          python -m pip install -r requirements-p4-global-source-validation.txt
          python -m pip install --no-deps .
          python -m pip check

      - name: Acquire immutable TabPFN-v2 checkpoints
        run: |
          mkdir -p "$TABPFN_MODEL_CACHE_DIR"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "$TABPFN_MODEL_CACHE_DIR/tabpfn-v2-classifier-finetuned-zk73skhh.ckpt" \
            "https://huggingface.co/Prior-Labs/TabPFN-v2-clf/resolve/f851f2a3c941544733b712d8c0f96dfae9b28862/tabpfn-v2-classifier-finetuned-zk73skhh.ckpt?download=true"
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --output "$TABPFN_MODEL_CACHE_DIR/tabpfn-v2-regressor.ckpt" \
            "https://huggingface.co/Prior-Labs/TabPFN-v2-reg/resolve/4972a65a1b30806315c6f92499959ffbfc69a673/tabpfn-v2-regressor.ckpt?download=true"
          echo "cf8c519c01eaf1613ee91239006d57b1c806ff5f23ac1aeb1315ba1015210e49  $TABPFN_MODEL_CACHE_DIR/tabpfn-v2-classifier-finetuned-zk73skhh.ckpt" | sha256sum --check
          echo "2ab5a07d5c41dfe6db9aa7ae106fc6de898326c2765be66505a07e2868c10736  $TABPFN_MODEL_CACHE_DIR/tabpfn-v2-regressor.ckpt" | sha256sum --check

      - name: Materialize and attest the official dataset
        run: >-
          python -m standardized_tabular_diffusion.cli materialize-dataset
          --dataset "${{ matrix.dataset }}"
          --timeout-seconds 120

      - name: Execute the preregistered shard
        run: >-
          python -m standardized_tabular_diffusion.validation.p4_dataset_scale run-shard
          --output "$P4_SHARD_OUTPUT"
          --dataset "${{ matrix.dataset }}"
          --mode "${{ matrix.mode }}"
          --shard-index "${{ matrix.shard_index }}"
          --shard-count "${{ matrix.shard_count }}"
          --classifier-checkpoint "$TABPFN_MODEL_CACHE_DIR/tabpfn-v2-classifier-finetuned-zk73skhh.ckpt"
          --regressor-checkpoint "$TABPFN_MODEL_CACHE_DIR/tabpfn-v2-regressor.ckpt"
          --require-primary-environment

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p4-dataset-scale-shard-${{ matrix.dataset }}-${{ matrix.mode }}-${{ matrix.shard_index }}
          path: ${{ runner.temp }}/p4-dataset-scale-shard.json
          if-no-files-found: error
          retention-days: 90

  finalize:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [protocol, dataset-scale]
    name: Finalize dataset-scale evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install finalizer dependencies
        run: |
          python -m pip install ".[dev]" "psutil==6.1.1"
          python -m pip check

      - name: Download every shard artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: p4-dataset-scale-shard-*
          path: ${{ runner.temp }}/p4-dataset-scale-shards

      - name: Finalize complete fail-closed evidence
        run: >-
          python -m standardized_tabular_diffusion.validation.p4_dataset_scale finalize
          --shards-dir "${{ runner.temp }}/p4-dataset-scale-shards"
          --output "${{ runner.temp }}/p4-dataset-scale-evidence.json"

      - name: Upload finalized evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: p4-dataset-scale-evidence
          path: ${{ runner.temp }}/p4-dataset-scale-evidence.json
          if-no-files-found: error
          retention-days: 90
